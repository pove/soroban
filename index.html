<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Japanese Abacus - Soroban</title>
    <meta
      name="description"
      content="Learn to calculate with the Japanese abacus (soroban): free play, number reading and arithmetic practice. Printable practice cards included."
    />
    <meta name="theme-color" content="#f6f1e9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14161d" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./images/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="./images/apple-touch-icon.png" />
  </head>
  <body class="game-page">
    <header class="site-header" id="siteHeader"></header>

    <main class="game">
      <nav class="modes" role="group" data-i18n-aria-label="game.modes">
        <button type="button" id="btnFree" class="mode-tab active" aria-pressed="true">
          <svg class="mode-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12m0-6.5v-1a1.5 1.5 0 0 1 3 0V12m0-6a1.5 1.5 0 0 1 3 0v6m0-3.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.5a6 6 0 0 1-4.6-2.2L4.3 15a1.6 1.6 0 0 1 2.4-2.1L8 14.3"
            />
          </svg>
          <span data-i18n="game.mode.free"></span>
        </button>
        <button type="button" id="btnRepresent" class="mode-tab" aria-pressed="false">
          <svg class="mode-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <circle cx="12" cy="12" r="5" />
            <circle cx="12" cy="12" r="1" />
          </svg>
          <span data-i18n="game.mode.represent"></span>
        </button>
        <button type="button" id="btnOperate" class="mode-tab" aria-pressed="false">
          <svg class="mode-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="4" />
            <path d="M7.5 8.5h4M9.5 6.5v4M13 15.5h4M7 14l3 3m0-3-3 3M13 8.5h4" />
          </svg>
          <span data-i18n="game.mode.operate"></span>
        </button>
      </nav>

      <div class="layout">
        <section class="display card" id="display">
          <div class="question-row">
            <div class="question" id="representQuestion"></div>
            <div class="question" id="question"></div>
            <button
              type="button"
              class="pill-button"
              id="btnCustomNumber"
              data-i18n-title="game.action.customTitle"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4" />
              </svg>
              <span data-i18n="game.action.custom"></span>
            </button>
            <button
              type="button"
              class="pill-button"
              id="btnCustomOperation"
              data-i18n-title="game.action.customTitle"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4" />
              </svg>
              <span data-i18n="game.action.custom"></span>
            </button>
          </div>
          <div class="value-row">
            <div class="number-display" id="numberDisplay" aria-live="polite">0</div>
            <button
              type="button"
              id="btnReset"
              class="icon-button"
              data-i18n-title="game.reset"
              data-i18n-aria-label="game.reset"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5" />
              </svg>
            </button>
          </div>
          <input
            type="number"
            id="numberInput"
            inputmode="numeric"
            min="0"
            max="9999999"
            data-i18n-placeholder="game.input.numberPlaceholder"
            data-i18n-aria-label="game.input.numberLabel"
            hidden
          />
          <div class="custom-editor" id="representEditor" hidden></div>
          <div class="custom-editor" id="operateEditor" hidden></div>
          <section class="stats" id="stats" data-i18n-aria-label="game.stats.label" hidden>
            <div class="stat" data-i18n-title="game.stats.solved">
              <span class="stat-icon" aria-hidden="true">✓</span>
              <span class="stat-value" id="statSolved">0</span
              ><span class="stat-label" data-i18n="game.stats.solved"></span>
            </div>
            <div class="stat stat--streak" data-i18n-title="game.stats.streak">
              <span class="stat-icon" aria-hidden="true">🔥</span>
              <span class="stat-value" id="statStreak">0</span
              ><span class="stat-label" data-i18n="game.stats.streak"></span>
            </div>
            <div class="stat stat--best" data-i18n-title="game.stats.best">
              <span class="stat-icon" aria-hidden="true">★</span>
              <span class="stat-value" id="statBest">0</span
              ><span class="stat-label" data-i18n="game.stats.best"></span>
            </div>
          </section>
        </section>

        <section class="board">
          <div class="abacus-container">
            <canvas id="abacusCanvas" role="img" data-i18n-aria-label="game.abacus.label"></canvas>
            <div class="digit-strip" id="digitStrip" aria-hidden="true">
              <span></span><span></span><span></span><span></span><span></span><span></span
              ><span></span>
            </div>
          </div>
          <div class="board-bar">
            <p class="hint" id="abacusHint" data-i18n="game.abacus.hint"></p>
          </div>
        </section>

        <!-- Represent mode -->
        <section class="game-panel card" id="representPanel">
          <div class="segmented" role="group">
            <button
              type="button"
              class="segment mode-repres active"
              data-mode="numberToAbacus"
              data-i18n="game.represent.numberToAbacus"
            ></button>
            <button
              type="button"
              class="segment mode-repres"
              data-mode="abacusToNumber"
              data-i18n="game.represent.abacusToNumber"
            ></button>
          </div>
          <div class="segmented" role="group" data-i18n-aria-label="game.difficulty.label">
            <button type="button" class="segment diff-btn" data-diff="veryEasy">
              <span class="level" aria-hidden="true"><i></i></span
              ><span data-i18n="game.difficulty.veryEasy"></span>
            </button>
            <button type="button" class="segment diff-btn" data-diff="easy">
              <span class="level" aria-hidden="true"><i></i><i></i></span
              ><span data-i18n="game.difficulty.easy"></span>
            </button>
            <button type="button" class="segment diff-btn" data-diff="medium">
              <span class="level" aria-hidden="true"><i></i><i></i><i></i></span
              ><span data-i18n="game.difficulty.medium"></span>
            </button>
            <button type="button" class="segment diff-btn" data-diff="hard">
              <span class="level" aria-hidden="true"><i></i><i></i><i></i><i></i></span
              ><span data-i18n="game.difficulty.hard"></span>
            </button>
          </div>
          <div class="result" id="representResult" role="status"></div>
          <div class="actions">
            <button
              type="button"
              class="btn btn-primary"
              id="btnValidateRepresent"
              data-i18n="game.action.validate"
            ></button>
            <button
              type="button"
              class="btn btn-next"
              id="btnNewRepresent"
              data-i18n="game.action.newNumber"
            ></button>
          </div>
        </section>

        <!-- Operate mode -->
        <section class="game-panel card" id="operatePanel">
          <div
            class="segmented segmented--ops"
            role="group"
            data-i18n-aria-label="game.operation.label"
          >
            <button type="button" class="segment op-btn active" data-op="+">
              <span class="op-symbol" aria-hidden="true">+</span
              ><span data-i18n="game.operation.add"></span>
            </button>
            <button type="button" class="segment op-btn" data-op="-">
              <span class="op-symbol" aria-hidden="true">−</span
              ><span data-i18n="game.operation.subtract"></span>
            </button>
            <button type="button" class="segment op-btn" data-op="×">
              <span class="op-symbol" aria-hidden="true">×</span
              ><span data-i18n="game.operation.multiply"></span>
            </button>
            <button type="button" class="segment op-btn" data-op="÷">
              <span class="op-symbol" aria-hidden="true">÷</span
              ><span data-i18n="game.operation.divide"></span>
            </button>
          </div>
          <div class="segmented" role="group" data-i18n-aria-label="game.difficulty.label">
            <button type="button" class="segment diff-btn" data-diff="veryEasy">
              <span class="level" aria-hidden="true"><i></i></span
              ><span data-i18n="game.difficulty.veryEasy"></span>
            </button>
            <button type="button" class="segment diff-btn" data-diff="easy">
              <span class="level" aria-hidden="true"><i></i><i></i></span
              ><span data-i18n="game.difficulty.easy"></span>
            </button>
            <button type="button" class="segment diff-btn" data-diff="medium">
              <span class="level" aria-hidden="true"><i></i><i></i><i></i></span
              ><span data-i18n="game.difficulty.medium"></span>
            </button>
            <button type="button" class="segment diff-btn" data-diff="hard">
              <span class="level" aria-hidden="true"><i></i><i></i><i></i><i></i></span
              ><span data-i18n="game.difficulty.hard"></span>
            </button>
          </div>
          <div class="result" id="result" role="status"></div>
          <div class="actions">
            <button
              type="button"
              class="btn btn-primary"
              id="btnValidate"
              data-i18n="game.action.validate"
            ></button>
            <button
              type="button"
              class="btn btn-next"
              id="btnNewQuestion"
              data-i18n="game.action.newQuestion"
            ></button>
          </div>
        </section>

        <section class="intro card" id="intro">
          <h2 data-i18n="game.intro.title"></h2>
          <div class="intro-legend" aria-hidden="true">
            <span class="legend-item"><span class="bead bead--upper"></span> = 5</span>
            <span class="legend-item"><span class="bead bead--lower"></span> = 1</span>
          </div>
          <p data-i18n="game.intro.what"></p>
          <p data-i18n="game.intro.how"></p>
        </section>

        <a class="promo" id="promoCards" href="./cards/">
          <span class="promo-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path
                d="M7 8V3h10v5M7 17H5a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M7 14h10v7H7z"
              />
            </svg>
          </span>
          <span class="promo-text">
            <strong data-i18n="game.promo.title"></strong>
            <small data-i18n="game.promo.text"></small>
          </span>
        </a>
      </div>
    </main>

    <!-- On-screen keyboard for touch devices (replaces the native one for custom input) -->
    <div class="keyboard" id="customKeyboard" hidden>
      <div class="keyboard-display" id="keyboardDisplay"></div>
      <div class="keyboard-grid">
        <button type="button" class="key" data-key="7">7</button>
        <button type="button" class="key" data-key="8">8</button>
        <button type="button" class="key" data-key="9">9</button>
        <button type="button" class="key key-operator" data-key="÷">÷</button>
        <button type="button" class="key" data-key="4">4</button>
        <button type="button" class="key" data-key="5">5</button>
        <button type="button" class="key" data-key="6">6</button>
        <button type="button" class="key key-operator" data-key="×">×</button>
        <button type="button" class="key" data-key="1">1</button>
        <button type="button" class="key" data-key="2">2</button>
        <button type="button" class="key" data-key="3">3</button>
        <button type="button" class="key key-operator" data-key="-">-</button>
        <button type="button" class="key key-wide" data-key="0">0</button>
        <button
          type="button"
          class="key key-danger"
          data-key="backspace"
          data-i18n-aria-label="game.custom.backspace"
        >
          ⌫
        </button>
        <button type="button" class="key key-operator" data-key="+">+</button>
        <button
          type="button"
          class="key key-done"
          data-key="done"
          data-i18n="game.custom.accept"
        ></button>
      </div>
    </div>

    <!-- Moved into the header menu by main.js -->
    <template id="gameSettings"
      ><label class="menu-field"
        ><span class="menu-label" data-i18n="game.settings.style"></span>
        <select id="abacusStyle" data-i18n-aria-label="game.settings.style">
          <option value="classic" data-i18n="game.style.classic"></option>
          <option value="simple" data-i18n="game.style.simple"></option></select
      ></label>
      <label class="menu-field"
        ><span class="menu-label" data-i18n="game.settings.confetti"></span>
        <select id="confettiMode" data-i18n-aria-label="game.settings.confetti">
          <option value="0" data-i18n="game.confetti.0"></option>
          <option value="1" data-i18n="game.confetti.1"></option>
          <option value="2" data-i18n="game.confetti.2"></option>
          <option value="3" data-i18n="game.confetti.3"></option>
          <option value="4" data-i18n="game.confetti.4"></option>
          <option value="5" data-i18n="game.confetti.5"></option>
          <option value="6" data-i18n="game.confetti.6"></option>
          <option value="7" data-i18n="game.confetti.7"></option>
          <option value="8" data-i18n="game.confetti.8"></option>
          <option value="9" data-i18n="game.confetti.9"></option>
          <option value="10" data-i18n="game.confetti.10"></option>
          <option value="surprise" data-i18n="game.confetti.surprise"></option></select
      ></label>
    </template>

    <footer class="site-footer">
      <span class="version" id="appVersion"></span>
    </footer>

    <script type="module" src="/src/game/main.js"></script>
  </body>
</html>
